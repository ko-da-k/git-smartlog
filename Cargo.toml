[package]
name = "git-smartlog"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A jj-like commit graph for plain git repositories"
license = "MIT"
repository = "https://github.com/ko-da-k/git-smartlog"
# Installed from git (`cargo install --git`), never published to crates.io.
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
gix = { version = "0.90.0", default-features = false, features = ["sha1"] }
sapling-renderdag = "0.1"
thiserror = "2.0.21"
