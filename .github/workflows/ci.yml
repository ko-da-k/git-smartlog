name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The e2e tests drive the `git` command and use GIT_CONFIG_GLOBAL=/dev/null,
        # so they run on Unix-like systems only.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The e2e tests only clone local repositories over file://, so they never
      # need the job token that checkout would otherwise leave in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the channel and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      # Formatting and lints do not depend on the OS, so run them once.
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - if: runner.os == 'Linux'
        run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
